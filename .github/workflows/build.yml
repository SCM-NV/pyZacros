name: Build

on: [push, pull_request]

jobs:
  build:
    name: Build for (${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    defaults:
      run:
        shell: bash -el {0}

    strategy:
      fail-fast: false
      matrix:
        os: ['ubuntu-latest', 'windows-latest', 'macos-latest']
        python-version: ['3.8', '3.9', '3.10', '3.11', '3.12', '3.13']

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Miniconda
        uses: conda-incubator/setup-miniconda@v4
        with:
          python-version: ${{ matrix.python-version }}
          channels: anaconda,conda-forge
          channel-priority: flexible
          activate-environment: build-env
          auto-activate-base: false
          auto-update-conda: false

      - name: Ensure pip
        run: |
          conda install -y -n build-env python=${{ matrix.python-version }} pip

      - name: Show environment
        run: |
          conda activate build-env
          conda --version
          python --version
          python -m pip --version
          which python || where python

      - name: Configure SCM package index
        env:
          SCM_DOWNLOADS_USERNAME: ${{ secrets.SCM_DOWNLOADS_USERNAME }}
          SCM_DOWNLOADS_PASSWORD: ${{ secrets.SCM_DOWNLOADS_PASSWORD }}
        run: |
          if [[ -z "${SCM_DOWNLOADS_USERNAME}" || -z "${SCM_DOWNLOADS_PASSWORD}" ]]; then
            echo "Missing SCM_DOWNLOADS_USERNAME or SCM_DOWNLOADS_PASSWORD secret."
            exit 1
          fi

          cat > "${HOME}/.netrc" << EOF
          machine downloads.scm.com
            login ${SCM_DOWNLOADS_USERNAME}
            password ${SCM_DOWNLOADS_PASSWORD}
          EOF
          chmod 600 "${HOME}/.netrc"

      - name: Install build and test dependencies
        env:
          PIP_EXTRA_INDEX_URL: https://downloads.scm.com/Downloads/packages/uv/channels/2026.1/simple/
        run: |
          conda activate build-env
          python -m pip install --upgrade pip
          python -m pip install build
          python -m pip install ".[test,doc]"

      - name: Build wheel
        run: |
          conda activate build-env
          python -m build

      - name: Install built wheel
        run: |
          conda activate build-env
          python - <<'PY'
          import glob
          import subprocess
          import sys

          wheels = glob.glob("dist/pyzacros-*.whl")
          if len(wheels) != 1:
              raise SystemExit(f"Expected exactly one wheel, found {len(wheels)}: {wheels}")

          subprocess.check_call([
              sys.executable,
              "-m",
              "pip",
              "install",
              "--force-reinstall",
              wheels[0],
          ])
          PY

      - name: Test
        env:
          MPLBACKEND: Agg
        run: |
          conda activate build-env
          python -m pytest tests
